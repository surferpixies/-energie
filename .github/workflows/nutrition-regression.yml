name: Nutrition FCEN regression
on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'foods.js'
      - 'cnf-*.js'
      - 'ciqual-*.js'
      - 'nutrition-corrections.js'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/nutrition-regression.yml'
  pull_request:
    paths:
      - 'app.js'
      - 'foods.js'
      - 'cnf-*.js'
      - 'ciqual-*.js'
      - 'nutrition-corrections.js'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/nutrition-regression.yml'
  workflow_dispatch:
jobs:
  nutrition:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test FCEN catalogue and matching safety
        run: NUTRITION_AUDIT_PATH=reports/fcen-mass-audit.json npm run test:nutrition
      - name: Upload FCEN audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fcen-mass-audit
          path: reports/fcen-mass-audit.json
          if-no-files-found: warn
